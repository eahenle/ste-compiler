[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ste-compiler"
version = "0.1.0"
description = "An auditable semantic-to-STE-inspired controlled-English prototype"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Adrian Henle"}]
keywords = ["controlled language", "NLP", "semantic IR", "reproducible ML"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0,<7", "typer>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/eahenle/ste-compiler"
Documentation = "https://github.com/eahenle/ste-compiler/tree/main/docs"
Repository = "https://github.com/eahenle/ste-compiler.git"
Issues = "https://github.com/eahenle/ste-compiler/issues"
Changelog = "https://github.com/eahenle/ste-compiler/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "pytest>=8",
  "hypothesis>=6",
  "mypy>=1.11",
  "pip>=24",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]
neural = [
  "huggingface-hub>=0.25,<2",
  "transformers>=4.45,<6",
  "peft>=0.13,<1",
  "torch>=2.4,<3",
  "safetensors>=0.4,<1",
  "tokenizers>=0.20,<1",
]
encoder-training = [
  "huggingface-hub>=0.25,<2",
  "safetensors>=0.4,<1",
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
]

[project.scripts]
ste-compiler = "ste_compiler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ste_compiler"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "ste_compiler/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "neural: requires the optional local neural training runtime",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
