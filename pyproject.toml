[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ste-compiler"
version = "0.1.0"
description = "An auditable semantic-to-STE-inspired controlled-English prototype"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.9,<3", "PyYAML>=6.0,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "pytest>=8",
  "hypothesis>=6",
  "mypy>=1.11",
  "pip>=24",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]
neural = ["transformers>=4.45", "peft>=0.13", "torch>=2.4"]

[project.scripts]
ste-compiler = "ste_compiler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ste_compiler"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "ste_compiler/data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
