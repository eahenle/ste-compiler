name: Release provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Reproducible release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TRANSFORMERS_OFFLINE: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out exact source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-provenance
      - name: Validate source identity and release gate
        shell: bash
        run: |
          set -euo pipefail
          mode="dry-run"
          tag_args=()
          allowed_signers=".github/release/trusted-tag-signers"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            mode="tag"
            tag_args=(--tag "${GITHUB_REF_NAME}")
            default_branch="${{ github.event.repository.default_branch }}"
            git check-ref-format --branch "${default_branch}" >/dev/null
            git fetch --no-tags --force origin \
              "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
            policy_ref="refs/remotes/origin/${default_branch}"
            default_commit="$(git rev-parse "${policy_ref}")"
            if [[ "${GITHUB_SHA}" != "${default_commit}" ]]; then
              echo "release tag commit is not the current default-branch commit" >&2
              exit 1
            fi
            allowed_signers="${RUNNER_TEMP}/trusted-tag-signers"
            git show \
              "${policy_ref}:.github/release/trusted-tag-signers" \
              > "${allowed_signers}"
          fi
          uv run --locked --python 3.12 --extra dev \
            python scripts/release/release_contract.py validate-ref \
            --root "${GITHUB_WORKSPACE}" \
            --mode "${mode}" \
            --commit "${GITHUB_SHA}" \
            "${tag_args[@]}" \
            --allowed-signers "${allowed_signers}" \
            --output "${RUNNER_TEMP}/release-identity.json"
      - name: Build and verify offline release candidates
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --python 3.12 --extra dev \
            python - "${RUNNER_TEMP}/release-identity.json" <<'PY'
          import sys
          from pathlib import Path

          from scripts.release.release_candidates import (
              build_candidate_directory,
              verify_candidate_directory,
          )
          from scripts.release.release_contract import read_identity

          identity = read_identity(Path(sys.argv[1]))
          candidates = Path(sys.argv[1]).parent / "release-candidates"
          build_candidate_directory(Path.cwd(), identity, candidates)
          verify_candidate_directory(candidates, identity)
          PY
      - name: Build and verify reproducible distributions
        run: >-
          uv run --locked --python 3.12 --extra dev
          python scripts/ci/distribution_smoke.py
          --release-output release/distributions
      - name: Stage the complete verified candidate directory
        shell: bash
        run: |
          set -euo pipefail
          mv "${RUNNER_TEMP}/release-candidates" release/candidates
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/distributions
          format: spdx-json
          output-file: release/ste-compiler.spdx.json
          syft-version: v1.50.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Finalize canonical manifest and checksums
        run: >-
          uv run --locked --python 3.12 --extra dev
          python scripts/release/release_contract.py finalize
          --release-root release
          --identity "${RUNNER_TEMP}/release-identity.json"
      - name: Verify final checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Upload verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ste-compiler-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release
          if-no-files-found: error
          retention-days: 14
